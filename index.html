<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>menu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #EDEBE5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2.5rem 1rem 1rem;
      gap: 2rem;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: #F7F6F2;
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.13), 0 1px 4px rgba(0,0,0,0.08);
      border: 1.5px solid rgba(0,0,0,0.07);
      width: 40%;
      min-width: 280px;
      justify-content: space-around;
    }

    .nav-item {
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: #5a5855;
      padding: 8px 0;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: color 0.18s, background 0.18s;
      position: relative;
      letter-spacing: 0.01em;
      white-space: nowrap;
      outline: none;
      flex: 1;
      text-align: center;
      text-transform: lowercase;
    }

    .nav-item:hover:not(.active) {
      color: #2a2926;
      background: rgba(0,0,0,0.045);
    }

    .nav-item.active {
      font-weight: 500;
      color: #2a2926;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 1.5px solid #9e9b97;
      pointer-events: none;
    }

    .page-content {
      width: 75%;
      min-width: 320px;
      background: #F7F6F2;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.09);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 2rem 2rem 1.5rem;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .page-title {
      font-size: 20px;
      font-weight: 500;
      color: #1a1917;
      text-transform: lowercase;
    }

    .page-body {
      font-size: 14px;
      color: #7a7874;
      line-height: 1.7;
    }

    .placeholder {
      width: 100%;
      border-radius: 8px;
      background: #e8e6e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-img span {
      font-size: 12px;
      color: #aaa8a2;
      letter-spacing: 0.04em;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .placeholder-sm {
      height: 54px;
      border-radius: 8px;
      background: #e8e6e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-sm span {
      font-size: 11px;
      color: #aaa8a2;
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <button class="nav-item" data-page="photography" onclick="switchPage('photography')">photography</button>
    <button class="nav-item active" data-page="home" onclick="switchPage('home')">home</button>
    <button class="nav-item" data-page="projects" onclick="switchPage('projects')">projects</button>
  </nav>

  <div class="page-content" id="page-content"></div>

  <script>
    const pages = {
      home: {
        title: 'welcome',
        body: '',
        extra: null
      },
      photography: {
        title: 'photography',
        body: '',
        extra: 'gallery'
      },
      projects: {
        title: 'projects',
        body: '',
        extra: 'grid'
      }
    };

    function switchPage(key) {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === key);
      });
      const p = pages[key];
      const content = document.getElementById('page-content');
      let extra = '';
      if (p.extra === 'gallery') {
        extra = `<div class="placeholder"><span><iframe src="https://petracoding.github.io/pinterest/board.html?link=secondsergio/hawaii/&hideHeader=0&hideFooter=1&transparent=1"></span></iframe></div>`;
      } else if (p.extra === 'grid') {
        extra = `<div class="grid2">
          <div class="placeholder-sm"><span>project a</span></div>
          <div class="placeholder-sm"><span>project b</span></div>
          <div class="placeholder-sm"><span>project c</span></div>
          <div class="placeholder-sm"><span>project d</span></div>
        </div>`;
      }
      content.innerHTML = `
        <div class="page-title">${p.title}</div>
        <div class="page-body">${p.body}</div>
        ${extra}
      `;
    }

    switchPage('home');
  </script>
</body>
</html>
